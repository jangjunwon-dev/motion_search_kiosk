# 모션인식 탐색 키오스크 설정
# 값을 바꾼 이유는 docs/experiments.md 에 기록해 주세요.

camera:
  enabled: true
  index: 0            # 노트북 내장 카메라 = 0, 외장 USB 카메라 = 1 인 경우가 많음
  width: 1280
  height: 720

detector:
  backend: yolo       # mock / yolo / rfdetr
  model_path: models/gesture_yolo26n.pt   # 저장소 루트 기준 상대경로
  conf: 0.4
  imgsz: 640
  device: null        # null = 자동(GPU 있으면 GPU), "cpu", "0"
  rfdetr_size: base   # backend=rfdetr 일 때: nano / small / base / medium
  # RF-DETR 은 클래스 이름을 가중치에 저장하지 않으므로 학습 순서대로 적어야 함
  class_names: [one, fist, palm, like, dislike, peace, no_gesture]
  # 모델 클래스 이름이 다를 때 바꿔주는 표 (예: HaGRID v2 'point' → 'one')
  label_map: {}

gesture:
  min_conf: 0.5
  min_hand_area: 0.004      # 화면의 0.4% 미만 손은 무시 (멀리 지나가는 사람)
  vote_window: 5
  vote_min: 3
  cursor_alpha: 0.35
  active_region: [0.15, 0.10, 0.85, 0.80]   # 카메라 화면 중 이 영역이 키오스크 화면 전체에 대응
  mirror: true
  click_window_s: 0.8
  swipe_window_s: 0.45
  swipe_min_dx: 0.18
  swipe_max_dy: 0.12
  hold_s: 0.7
  cooldown_s: 0.9
  lost_after_s: 1.0
  hold_commands:
    like: confirm
    dislike: back
    peace: home

server:
  host: 127.0.0.1
  port: 8000

log_events: true            # logs/events_*.csv 에 명령 기록 (성능평가용)
