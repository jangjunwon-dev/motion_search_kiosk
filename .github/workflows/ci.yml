name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    # 팀원 둘 다 Windows → Windows 에서도 테스트 (한글 인코딩 cp949 문제 등을 미리 잡기 위해)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 의존성 설치 (서비스·테스트만 — torch 불필요)
        run: python -m pip install -r requirements.txt
      - name: 테스트
        run: python -m pytest -q
